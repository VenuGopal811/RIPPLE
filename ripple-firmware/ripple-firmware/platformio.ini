; RIPPLE firmware, one environment per physical node.
; Same codebase for all four, role and identity selected by build_flags.
; Flash with: pio run -e node_a -t upload   (swap -e for each board in turn)
; Monitor with: pio run -e node_a -t monitor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Node A: has a sensor, first witness.
[env:node_a]
build_flags =
    -D NODE_ID='"A"'
    -D ROLE_SENSOR=1

; Node B: has a sensor, second independent witness.
; Also reacts to A's report alone with light caution before its own sensor fires.
[env:node_b]
build_flags =
    -D NODE_ID='"B"'
    -D ROLE_SENSOR=1

; Node C: relay only, confirms locally once it holds two distinct sources,
; small course-adjustment reaction.
[env:node_c]
build_flags =
    -D NODE_ID='"C"'
    -D ROLE_RELAY=1

; Node D: relay only, same confirmation rule, full-reroute reaction, drives
; buzzer + LED, and bridges confirmed state to the laptop over USB serial
; as JSON for the dashboard and the 2D visualization.
[env:node_d]
build_flags =
    -D NODE_ID='"D"'
    -D ROLE_RELAY=1
    -D ROLE_GATEWAY=1
